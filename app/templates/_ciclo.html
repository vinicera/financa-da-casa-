{% from "_icones.html" import icone %}
<div class="ciclo-nav">
  <a class="botao-redondo" href="?ciclo={{ ciclo.anterior().inicio.isoformat() }}" aria-label="Ciclo anterior">{{ icone("anterior") }}</a>
  <div>
    <strong>{{ ciclo.rotulo }}</strong>
    <span class="apoio">{{ ciclo.intervalo }}</span>
  </div>
  <a class="botao-redondo" href="?ciclo={{ ciclo.proximo().inicio.isoformat() }}" aria-label="Próximo ciclo">{{ icone("proximo") }}</a>
</div>
